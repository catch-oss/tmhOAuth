name: Claude Auto Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  auto-review:
    env:
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        if: env.anthropic_api_key != ''
        with:
          fetch-depth: 1

      - name: Automatic PR Review
        uses: anthropics/claude-code-action@beta
        if: env.anthropic_api_key != ''
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          timeout_minutes: "60"
          direct_prompt: |
            Review this SS6 migration PR. Focus on:
            - Correct SS5->SS6 namespace renames (ArrayList, ViewableData, ValidationResult, etc.)
            - PHP 8.5 compatibility (implicit nullable params, return types, deprecated features)
            - Proper PHPUnit 11 test migration (attributes vs annotations, removed methods)
            - Catch logging standard compliance (Monolog format: [%d] %p %c - %m)
            - No regressions in functionality
            - composer.json version constraints are correct for SS6

            Flag any remaining SS5 patterns that should have been migrated.
